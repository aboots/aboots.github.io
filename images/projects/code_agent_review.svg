<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Diagram of a main coding agent sending work to a separate reviewer">
  <rect width="800" height="500" fill="#f3f6fa"/>
  <text x="48" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#0f2b46">Code Agent Review Council</text>
  <text x="48" y="96" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#5c6b7a">One agent implements. A different agent reviews.</text>
  <rect x="48" y="140" width="260" height="168" rx="16" fill="#ffffff" stroke="#0f2b46" stroke-width="2.5"/>
  <text x="178" y="208" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f2b46">Main agent</text>
  <text x="178" y="240" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5c6b7a">implements the change</text>
  <line x1="324" y1="224" x2="458" y2="224" stroke="#1f6f8b" stroke-width="3"/>
  <polygon points="458,216 478,224 458,232" fill="#1f6f8b"/>
  <text x="392" y="206" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f6f8b">review</text>
  <rect x="492" y="140" width="260" height="168" rx="16" fill="#0f2b46"/>
  <text x="622" y="208" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Reviewer</text>
  <text x="622" y="240" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d5e4ee">separate read-only CLI</text>
  <g font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f2b46">
    <rect x="48" y="360" width="150" height="42" rx="21" fill="#ffffff" stroke="#c5d0dc"/>
    <text x="123" y="386" text-anchor="middle">Codex</text>
    <rect x="214" y="360" width="150" height="42" rx="21" fill="#ffffff" stroke="#c5d0dc"/>
    <text x="289" y="386" text-anchor="middle">Cursor</text>
    <rect x="380" y="360" width="176" height="42" rx="21" fill="#ffffff" stroke="#c5d0dc"/>
    <text x="468" y="386" text-anchor="middle">Claude Code</text>
    <rect x="572" y="360" width="180" height="42" rx="21" fill="#ffffff" stroke="#c5d0dc"/>
    <text x="662" y="386" text-anchor="middle">Antigravity</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5c6b7a">Any of the four can implement. A different one reviews.</text>
</svg>
