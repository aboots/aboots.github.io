# Publications rendered on /research/.
#
# To feature a paper, set selected: true (highlight: true also works).
# Featured cards follow the order of entries in this file. Delete the flag to
# remove a paper from Selected publications.
#
# Optional fields:
#   preview: "/images/publications/example.webp"  teaser on a featured card and a thumbnail in the year list
#   preview_alt: "What the figure shows"
#   month, detail, note, venue       venue is the booktitle used for BibTeX
#   kind: findings | workshop        adds a second pill; omit for a main venue
#   status: published | under_review | preprint
#   venue_class: neurips, emnlp, acl, miccai, mlhc, iclr, ipcai, acm, ecir,
#                semeval, spie, review, preprint
#   topics: medical, multimodal, nlp, survey, ml
#   equal: true                      on an author, prints the equal-contribution *
#   me: true                         bold an author whose name is not site.author.name
#   bibtex: |                        optional full override of the generated BibTeX
#   links: label, icon, url
#     icons: paper, arxiv, code, project, dataset, poster, models, openreview
#
# His name is bolded automatically when it matches site.author.name.

